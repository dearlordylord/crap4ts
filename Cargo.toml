[workspace]
members = ["crates/crap4ts-core", "crates/crap4ts-cli"]
default-members = ["crates/crap4ts-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.94"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
oxc_allocator = "0.139"
oxc_ast = "0.139"
oxc_ast_visit = "0.139"
oxc_parser = "0.139"
oxc_span = "0.139"
oxc_syntax = "0.139"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
